<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>15关闯关小游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111;overflow:hidden;touch-action:none}
#gameBox{
    position:relative;
    width:100vw;
    height:100vh;
}
canvas{display:block;background:#1a1a2e}

/* UI */
#info{
    position:fixed;top:12px;left:12px;color:#fff;font-size:18px;z-index:10;text-shadow:0 0 4px #000;
}
#tip{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.85);color:#fff;padding:24px 40px;border-radius:12px;
    font-size:22px;z-index:20;text-align:center;display:none;
}
#tip button{
    margin-top:14px;padding:8px 22px;font-size:17px;border:none;border-radius:6px;background:#2196F3;color:#fff;
}

/* 手机虚拟方向按键 */
#dpad{
    position:fixed;bottom:20px;left:20px;z-index:15;display:grid;
    grid-template-columns:65px 65px 65px;grid-template-rows:65px 65px 65px;gap:4px;
}
#dpad button{
    border:none;border-radius:8px;background:rgba(255,255,255,0.22);color:#fff;font-size:26px;
}
#dpad .empty{background:transparent;pointer-events:none}

@media (min-width:768px){
    #dpad{display:none;} /*电脑隐藏虚拟按键*/
}
</style>
</head>
<body>
<div id="gameBox">
    <canvas id="cv"></canvas>
    <div id="info">关卡：1 / 15</div>
    <div id="tip">
        <div id="tipText"></div>
        <button id="tipBtn">继续</button>
    </div>
    <div id="dpad">
        <div class="empty"></div>
        <button data-key="up">↑</button>
        <div class="empty"></div>
        <button data-key="left">←</button>
        <div class="empty"></div>
        <button data-key="right">→</button>
        <div class="empty"></div>
        <button data-key="down">↓</button>
        <div class="empty"></div>
    </div>
</div>

<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
let w,h;

// 玩家小球
const player = {
    x:50,y:50,r:14,speed:4,
    vx:0,vy:0
}

let currentLevel = 0;
// 15关数据：walls墙[{x,y,w,h}], start起点{x,y}, goal终点{x,y,r}
const levels = [
//1
{walls:[{x:120,y:80,w:180,h:12}], start:{x:40,y:40}, goal:{x:480,y:320,r:18}},
//2
{walls:[{x:100,y:60,w:12,h:180},{x:240,y:140,w:180,h:12}], start:{x:40,y:40}, goal:{x:480,y:340,r:18}},
//3
{walls:[{x:80,y:50,w:220,h:12},{x:80,y:180,w:12,h:160},{x:220,y:220,w:240,h:12}], start:{x:40,y:40}, goal:{x:480,y:340,r:18}},
//4
{walls:[{x:60,y:40,w:12,h:220},{x:180,y:120,w:12,h:220},{x:320,y:40,w:12,h:220}], start:{x:30,y:30}, goal:{x:460,y:300,r:18}},
//5
{walls:[{x:50,y:60,w:300,h:12},{x:120,y:130,w:12,h:180},{x:260,y:80,w:12,h:220}], start:{x:30,y:30}, goal:{x:470,y:330,r:18}},
//6
{walls:[{x:40,y:40,w:14,h:240},{x:160,y:120,w:180,h:14},{x:340,y:40,w:14,h:220}], start:{x:20,y:30}, goal:{x:470,y:320,r:18}},
//7
{walls:[{x:70,y:70,w:200,h:12},{x:70,y:70,w:12,h:160},{x:220,y:180,w:220,h:12},{x:380,y:80,w:12,h:160}], start:{x:30,y:30}, goal:{x:470,y:330,r:18}},
//8
{walls:[{x:50,y:50,w:12,h:260},{x:140,y:100,w:12,h:200},{x:240,y:60,w:12,h:220},{x:340,y:100,w:12,h:200}], start:{x:25,y:30}, goal:{x:470,y:320,r:18}},
//9
{walls:[{x:60,y:60,w:280,h:12},{x:60,y:60,w:12,h:140},{x:180,y:160,w:12,h:160},{x:300,y:100,w:12,h:180}], start:{x:30,y:30}, goal:{x:470,y:330,r:18}},
//10
{walls:[{x:40,y:40,w:12,h:280},{x:130,y:80,w:160,h:12},{x:130,y:180,w:12,h:140},{x:270,y:120,w:160,h:12}], start:{x:20,y:30}, goal:{x:470,y:330,r:18}},
//11
{walls:[{x:50,y:50,w:320,h:12},{x:50,y:50,w:12,h:180},{x:160,y:140,w:12,h:200},{x:280,y:80,w:12,h:220},{x:400,y:120,w:12,h:180}], start:{x:25,y:30}, goal:{x:480,y:340,r:18}},
//12
{walls:[{x:60,y:60,w:12,h:240},{x:150,y:120,w:220,h:12},{x:150,y:220,w:12,h:140},{x:290,y:80,w:12,h:180},{x:400,y:160,w:120,h:12}], start:{x:30,y:30}, goal:{x:480,y:340,r:18}},
//13
{walls:[{x:40,y:40,w:12,h:300},{x:120,y:90,w:12,h:220},{x:220,y:50,w:12,h:240},{x:320,y:90,w:12,h:220},{x:420,y:50,w:12,h:240}], start:{x:20,y:30}, goal:{x:480,y:330,r:18}},
//14
{walls:[{x:50,y:50,w:340,h:12},{x:50,y:50,w:12,h:200},{x:140,y:130,w:12,h:220},{x:240,y:70,w:12,h:240},{x:340,y:130,w:12,h:200}], start:{x:25,y:30}, goal:{x:480,y:340,r:18}},
//15
{walls:[{x:40,y:40,w:12,h:320},{x:110,y:70,w:180,h:12},{x:110,y:170,w:12,h:180},{x:230,y:110,w:180,h:12},{x:230,y:210,w:12,h:140},{x:350,y:150,w:120,h:12},{x:350,y:250,w:12,h:100}], start:{x:20,y:30}, goal:{x:480,y:340,r:18}}
];

let keys = {up:false,down:false,left:false,right:false};
let showDialog = false;
let dialogText = "";

// 适配画布大小
function resize(){
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
}

//加载关卡
function loadLevel(idx){
    const lv = levels[idx];
    player.x = lv.start.x;
    player.y = lv.start.y;
    player.vx = 0; player.vy =0;
    document.getElementById('info').innerText = `关卡：${idx+1} / 15`;
}

//圆形矩形碰撞
function circleRectCollision(cx,cy,r,rx,ry,rw,rh){
    let nearX = Math.max(rx, Math.min(cx, rx+rw));
    let nearY = Math.max(ry, Math.min(cy, ry+rh));
    let dx = cx - nearX;
    let dy = cy - nearY;
    return (dx*dx+dy*dy) < r*r;
}

//更新游戏逻辑
function update(){
    if(showDialog) return;
    const lv = levels[currentLevel];

    player.vx=0; player.vy=0;
    if(keys.up) player.vy = -player.speed;
    if(keys.down) player.vy = player.speed;
    if(keys.left) player.vx = -player.speed;
    if(keys.right) player.vx = player.speed;

    let nx = player.x + player.vx;
    let ny = player.y + player.vy;

    //墙壁碰撞
    for(let wall of lv.walls){
        if(circleRectCollision(nx, player.y, player.r, wall.x,wall.y,wall.w,wall.h)){
            nx = player.x;
        }
        if(circleRectCollision(player.x, ny, player.r, wall.x,wall.y,wall.w,wall.h)){
            ny = player.y;
        }
    }

    //边界
    nx = Math.max(player.r, Math.min(w-player.r, nx));
    ny = Math.max(player.r, Math.min(h-player.r, ny));

    player.x = nx;
    player.y = ny;

    //检测到达终点
    const g = lv.goal;
    const dist = Math.hypot(player.x-g.x, player.y-g.y);
    if(dist < player.r + g.r){
        nextLevel();
    }
}

function nextLevel(){
    currentLevel++;
    if(currentLevel >= levels.length){
        showMessage("🎉恭喜！通关全部15关！","重新开始");
        currentLevel = 0;
    }else{
        showMessage(`✅第${currentLevel}关完成！`,`进入第${currentLevel+1}关`);
    }
}

function showMessage(text,btnText){
    showDialog = true;
    dialogText = text;
    document.getElementById("tipText").innerText = text;
    document.getElementById("tipBtn").innerText = btnText;
    document.getElementById("tip").style.display = "block";
}

document.getElementById("tipBtn").onclick = ()=>{
    showDialog = false;
    document.getElementById("tip").style.display = "none";
    loadLevel(currentLevel);
}

//渲染
function render(){
    ctx.clearRect(0,0,w,h);
    const lv = levels[currentLevel];

    //绘制墙
    ctx.fillStyle="#4466aa";
    for(let wall of lv.walls){
        ctx.fillRect(wall.x,wall.y,wall.w,wall.h);
    }

    //终点绿色圆
    ctx.beginPath();
    ctx.arc(lv.goal.x, lv.goal.y, lv.goal.r,0,Math.PI*2);
    ctx.fillStyle="#39d353";
    ctx.fill();

    //玩家小球
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
    ctx.fillStyle="#ff5555";
    ctx.fill();
}

function loop(){
    update();
    render();
    requestAnimationFrame(loop);
}

//键盘监听电脑
window.addEventListener("keydown",e=>{
    switch(e.key.toLowerCase()){
        case "w":case "arrowup": keys.up=true;break;
        case "s":case "arrowdown": keys.down=true;break;
        case "a":case "arrowleft": keys.left=true;break;
        case "d":case "arrowright": keys.right=true;break;
    }
})
window.addEventListener("keyup",e=>{
    switch(e.key.toLowerCase()){
        case "w":case "arrowup": keys.up=false;break;
        case "s":case "arrowdown": keys.down=false;break;
        case "a":case "arrowleft": keys.left=false;break;
        case "d":case "arrowright": keys.right=false;break;
    }
})

//手机虚拟按键
const dpadBtns = document.querySelectorAll("#dpad button");
dpadBtns.forEach(btn=>{
    const k = btn.dataset.key;
    btn.addEventListener("touchstart",(e)=>{e.preventDefault();keys[k]=true})
    btn.addEventListener("touchend",(e)=>{e.preventDefault();keys[k]=false})
})

window.addEventListener("resize",resize);
resize();
loadLevel(0);
loop();
</script>
</body>
</html>
