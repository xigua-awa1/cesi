<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>演示站点</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, sans-serif;
            min-height: 100vh;
        }
        nav {
            background-color: #1f1f1f;
            padding: 16px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }
        nav a {
            color: #42a5f5;
            text-decoration: none;
            font-size: 17px;
            cursor: pointer;
        }
        nav a:hover {
            color: #ffca28;
        }
        .container {
            padding: 40px 20px;
            max-width: 700px;
            margin: 0 auto;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .tip-text {
            font-size: 24px;
            text-align: center;
            margin-top: 120px;
            color:#bbbbbb;
        }
    </style>
</head>
<body>
    <nav>
        <a data-page="home">首页</a>
        <a data-page="cn">国产</a>
        <a data-page="jpkr">日韩</a>
        <a data-page="euus">欧美</a>
    </nav>
    <div class="container">
        <!-- 首页，主体空白 -->
        <div id="home" class="page active">

        </div>
        <!-- 国产 -->
        <div id="cn" class="page">
            <div class="tip-text">你还真看啊兄dei</div>
        </div>
        <!-- 日韩 -->
        <div id="jpkr" class="page">
            <div class="tip-text">你还真看啊兄dei</div>
        </div>
        <!-- 欧美 -->
        <div id="euus" class="page">
            <div class="tip-text">你还真看啊兄dei</div>
        </div>
    </div>

<script>
const pageList = document.querySelectorAll('.page');
function showPage(pageId) {
    pageList.forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
}
document.querySelectorAll('nav a').forEach(item=>{
    item.addEventListener('click', ()=>{
        showPage(item.dataset.page);
    })
})
</script>
</body>
</html>
