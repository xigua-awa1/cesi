<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>跑酷小游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0b1020;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
canvas{
  touch-action:none;
  max-width:100%;
  max-height:100vh;
  background:#16213e;
}
#btnDown{
  position:fixed;
  right:20px;
  bottom:30px;
  width:72px;
  height:72px;
  background:rgba(255,255,255,0.2);
  color:#fff;
  font-size:34px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.45);
  display:flex;
  justify-content:center;
  align-items:center;
  user-select:none;
  -webkit-user-select:none;
}
#btnDown:active{
  background:rgba(255,255,255,0.35);
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="btnDown">↓</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const btnDown = document.getElementById('btnDown');

let bestScore = Number(localStorage.getItem("parkourBest")) || 0;

function resize(){
  const w = Math.min(window.innerWidth, 920);
  const h = Math.min(window.innerHeight, 620);
  canvas.width = w;
  canvas.height = h;
}
resize();
window.addEventListener('resize', resize);

const game = {
  score: 0,
  over: false,
  speed: 4,
  baseSpeed: 4,
  maxSpeed: 14.5,
  speedIncreasePerScore: 0.0042
};

const player = {
  x: 140,
  y: 200,
  w: 28,
  h: 36,
  vy: 0,
  bumpBouncePower: -15,
  jumpPower: -13.2,
  fastFallPower: 14.5,
  gravity: 0.52,
  onGround: false
};

let platforms = [];
let bumps = [];
let mountains = [];
let solidBlocks = [];
let clouds = [];
let stars = [];
let slopes = [];

function rectCollide(a, b){
  return a.x < b.x + b.w &&
         a.x + a.w > b.x &&
         a.y < b.y + b.h &&
         a.y + a.h > b.y;
}

function spawnStar(){
  stars.push({
    x: canvas.width + Math.random()*200,
    y: Math.random() * canvas.height*0.65,
    r: Math.random()*1.4+0.4,
    speed: 0.15 + Math.random()*0.25
  });
}

function spawnCloud(px){
  clouds.push({
    x: px,
    y: 40 + Math.random()*160,
    w:70 + Math.random()*110,
    h:24 + Math.random()*36,
    speed:0.22 + Math.random()*0.28
  });
}

function slopeBounds(s){
  return { x: Math.min(s.x1, s.x2), y: Math.min(s.y1, s.y2), w: Math.abs(s.x2 - s.x1), h: Math.abs(s.y2 - s.y1) };
}

function slopeConflicts(s){
  const b = slopeBounds(s);
  for(let blk of solidBlocks){
    if(rectCollide(b, blk)) return true;
  }
  for(let p of bumps){
    if(rectCollide(b, p)) return true;
  }
  return false;
}

function updateSlopeCollision(){
  for(let s of slopes){
    const dx = s.x2 - s.x1;
    const dy = s.y2 - s.y1;
    const footX = player.x + player.w / 2;
    const footY = player.y + player.h;

    if(footX < s.x1 || footX > s.x2) continue;

    const t = (footX - s.x1) / dx;
    const slopeY = s.y1 + dy * t;

    if(player.vy >= 0 && footY <= slopeY + 6 && footY >= slopeY - 18){
      player.y = slopeY - player.h;
      player.vy = 0;
      player.onGround = true;
    }
  }
}

function handleSolidBlockCollision(){
  for(let blk of solidBlocks){
    if(!rectCollide(player, blk)) continue;

    const overlapLeft  = (player.x + player.w) - blk.x;
    const overlapRight = (blk.x + blk.w) - player.x;
    const overlapTop   = (player.y + player.h) - blk.y;
    const overlapBot   = (blk.y + blk.h) - player.y;

    const minX = Math.min(overlapLeft, overlapRight);
    const minY = Math.min(overlapTop, overlapBot);

    if(minX < minY){
      if(overlapLeft < overlapRight){
        player.x = blk.x - player.w;
      }else{
        player.x = blk.x + blk.w;
      }
    }else{
      if(overlapTop < overlapBot){
        player.y = blk.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }else{
        player.y = blk.y + blk.h;
        player.vy = Math.max(player.vy,0);
      }
    }
  }
}

function generateBlockHill(platform){
  const hillBaseX = platform.x + platform.w * 0.55;
  const hillTopCount = 2 + Math.floor(Math.random() * 3);
  const blockSize = 34;

  for(let layer = 0; layer < hillTopCount; layer++){
    const countInLayer = hillTopCount - layer;
    const layerY = platform.y - blockSize * (layer + 1);

    for(let i = 0; i < countInLayer; i++){
      const bx = hillBaseX + i * blockSize - ((countInLayer - 1) * blockSize) / 2;
      solidBlocks.push({
        x: bx,
        y: layerY,
        w: blockSize,
        h: blockSize
      });
    }
  }
}

function initMap(){
  platforms = [];
  bumps = [];
  mountains = [];
  solidBlocks = [];
  clouds = [];
  stars = [];
  slopes = [];

  player.x = 140;
  player.y = 200;
  player.vy = 0;
  player.onGround = false;

  game.score = 0;
  game.speed = game.baseSpeed;
  game.over = false;

  platforms.push({ x: 0, y: canvas.height - 80, w: 440, h: 22 });

  let lastX = 400;
  for(let i = 0; i < 12; i++){
    const maxVerticalDelta = 135;
    const prevPlatform = platforms[platforms.length - 1];
    const baseY = prevPlatform.y;
    const py = Math.max(100, Math.min(canvas.height - 60, baseY + (Math.random()*maxVerticalDelta*2 - maxVerticalDelta)));

    const gap = 72 + Math.random() * 75;
    const pw = 82 + Math.random() * 105;
    platforms.push({ x: lastX + gap, y: py, w: pw, h: 22 });

    // 降低黄色弹簧生成概率
    if(Math.random() < 0.12){
      bumps.push({
        x: lastX + gap + pw / 2 - 14,
        y: py - 24,
        w: 28,
        h: 24
      });
    }

    if(Math.random() < 0.22){
      generateBlockHill({ x: lastX + gap, y: py, w: pw });
    }

    if(Math.random() < 0.28){
      const sx1 = lastX + gap + 6 + Math.random() * 20;
      const sx2 = sx1 + 70 + Math.random() * 70;
      const topY = py - 30 - Math.random() * 40;
      const bottomY = py;
      const slope = { x1: sx1, y1: topY, x2: sx2, y2: bottomY };
      if(!slopeConflicts(slope)) slopes.push(slope);
    }

    if(Math.random() > 0.38){
      mountains.push({
        x: lastX + gap + Math.random()*pw,
        height: 85 + Math.random()*170,
        width: 125 + Math.random()*190
      });
    }
    if(Math.random()>0.55) spawnCloud(lastX+gap);
    lastX = lastX + gap + pw;
  }
  for(let s=0;s<25;s++) spawnStar();
}

function generateMore(){
  const rightMost = Math.max(...platforms.map(p => p.x + p.w));
  while(rightMost < canvas.width + 650){
    const last = platforms[platforms.length - 1];
    const maxVerticalDelta = 135;
    const baseY = last.y;
    const py = Math.max(100, Math.min(canvas.height - 60, baseY + (Math.random()*maxVerticalDelta*2 - maxVerticalDelta)));

    const gapDifficulty = Math.min(game.score * 0.021, 38);
    const gap = 76 + Math.random() * 72 + gapDifficulty;
    const pw = 78 + Math.random() * 102;

    platforms.push({
      x: last.x + last.w + gap,
      y: py,
      w: pw,
      h: 22
    });

    // 随分数缓慢提升，上限压低，减少黄色方块
    const bumpRate = Math.min(0.12 + game.score * 0.00012, 0.22);
    if(Math.random() < bumpRate){
      bumps.push({
        x: last.x + last.w + gap + pw / 2 - 14,
        y: py - 24,
        w: 28,
        h: 24
      });
    }

    if(Math.random() < 0.24){
      generateBlockHill({ x: last.x + last.w + gap, y: py, w: pw });
    }

    if(Math.random() < 0.32){
      const sx1 = last.x + last.w + gap + 6 + Math.random() * 20;
      const sx2 = sx1 + 70 + Math.random() * 70;
      const topY = py - 30 - Math.random() * 40;
      const bottomY = py;
      const slope = { x1: sx1, y1: topY, x2: sx2, y2: bottomY };
      if(!slopeConflicts(slope)) slopes.push(slope);
    }

    if(Math.random()>0.38){
      mountains.push({
        x: last.x + last.w + gap + Math.random()*pw,
        height:85 + Math.random()*170,
        width:125 + Math.random()*190
      });
    }
    if(Math.random()>0.52) spawnCloud(last.x+last.w+gap);
    if(Math.random()>0.65) spawnStar();
    break;
  }
}

function jump(){
  if(game.over) return;
  if(player.onGround){
    player.vy = player.jumpPower;
    player.onGround = false;
  }
}

function fastFall(){
  if(game.over) return;
  player.vy = player.fastFallPower;
  player.onGround = false;
}

window.addEventListener('keydown', e => {
  if(e.code === 'Space') {e.preventDefault(); jump();}
  if(e.code === 'KeyS') fastFall();
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if(game.over){
    initMap();
  }else{
    jump();
  }
});
canvas.addEventListener('mousedown', () => {
  if(game.over){
    initMap();
  }else{
    jump();
  }
});

btnDown.addEventListener('touchstart', e => {
  e.preventDefault();
  fastFall();
});
btnDown.addEventListener('mousedown', fastFall);

function update(){
  if(game.over) return;

  game.score += 0.15;
  game.speed = game.baseSpeed + game.score * game.speedIncreasePerScore;
  if(game.speed > game.maxSpeed) game.speed = game.maxSpeed;

  player.vy += player.gravity;
  player.y += player.vy;
  player.onGround = false;

  for(let p of platforms) p.x -= game.speed;
  for(let b of bumps) b.x -= game.speed;
  for(let blk of solidBlocks) blk.x -= game.speed;
  for(let s of slopes){ s.x1 -= game.speed; s.x2 -= game.speed; }
  for(let m of mountains) m.x -= game.speed * 0.34;
  for(let c of clouds) c.x -= c.speed;
  for(let s of stars) s.x -= s.speed;

  platforms = platforms.filter(p => p.x + p.w > -30);
  bumps = bumps.filter(b => b.x + b.w > -30);
  solidBlocks = solidBlocks.filter(blk => blk.x + blk.w > -40);
  slopes = slopes.filter(s => s.x2 > -40);
  mountains = mountains.filter(m => m.x + m.width > -80);
  clouds = clouds.filter(c => c.x + c.w > -60);
  stars = stars.filter(s => s.x > -20);

  generateMore();

  for(let p of platforms){
    if(rectCollide(player, p)){
      if(player.vy > 0 && player.y + player.h - player.vy <= p.y + 5){
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }

  updateSlopeCollision();

  // 修改：只要碰到黄色弹簧方块任意部位就触发弹跳，不再限定从上方落下
  for(let b of bumps){
    if(rectCollide(player, b)){
      player.vy = player.bumpBouncePower;
      player.onGround = false;
    }
  }

  handleSolidBlockCollision();

  if(player.y > canvas.height + 50){
    game.over = true;
    if(game.score > bestScore){
      bestScore = Math.floor(game.score);
      localStorage.setItem("parkourBest",bestScore);
    }
  }
}

function draw(){
  const grad = ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,"#0c1433");
  grad.addColorStop(1,"#142042");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle="#ffffff";
  for(let s of stars){
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle="rgba(255,255,255,0.08)";
  for(let c of clouds){
    ctx.fillRect(c.x,c.y,c.w,c.h);
  }

  ctx.fillStyle="#1e2c4c";
  for(let m of mountains){
    ctx.beginPath();
    ctx.moveTo(m.x, canvas.height);
    ctx.lineTo(m.x + m.width/2, canvas.height - m.height);
    ctx.lineTo(m.x + m.width, canvas.height);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = '#5a7fa8';
  for(let s of slopes){
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.lineTo(s.x2, s.y2 + 18);
    ctx.lineTo(s.x1, s.y1 + 18);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#8cb3d9';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
  }

  ctx.fillStyle="#0f3460";
  for(let p of platforms){
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle="#215088";
    ctx.fillRect(p.x,p.y,p.w,4);
    ctx.fillStyle="#0f3460";
  }

  for(let blk of solidBlocks){
    ctx.fillStyle="#365a8b";
    ctx.fillRect(blk.x,blk.y,blk.w,blk.h);
    ctx.strokeStyle="#547cad";
    ctx.lineWidth=2;
    ctx.strokeRect(blk.x,blk.y,blk.w,blk.h);
  }

  ctx.fillStyle="#facc15";
  for(let b of bumps){
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle="#fde047";
    ctx.fillRect(b.x,b.y,b.w,5);
    ctx.fillStyle="#facc15";
  }

  ctx.fillStyle="#22e5e5";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle="#ffffff";
  ctx.font = 'bold 20px sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`分数：${Math.floor(game.score)}`, 22, 32);
  ctx.fillText(`速度：${game.speed.toFixed(1)}`, 22, 58);
  ctx.fillText(`最高分：${bestScore}`,22,84);

  if(game.over){
    ctx.fillStyle = '#ff5566';
    ctx.font = 'bold 40px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('游戏结束', canvas.width / 2, canvas.height / 2 - 40);

    ctx.fillStyle="#ffffff";
    ctx.font='22px sans-serif';
    ctx.fillText(`本次得分：${Math.floor(game.score)}`,canvas.width/2,canvas.height/2);
    ctx.fillText(`历史最高：${bestScore}`,canvas.width/2,canvas.height/2+30);
    ctx.font='19px sans-serif';
    ctx.fillText('点击屏幕 / 空格键重新开始', canvas.width / 2, canvas.height / 2 + 65);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

initMap();
loop();
</script>
</body>
</html>
